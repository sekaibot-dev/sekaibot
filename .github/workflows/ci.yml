name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install uv
        uv sync
        uv pip install ruff mypy pylint pyright

    - name: Run ruff (linter)
      run: ruff check

    - name: Run mypy (type checker)
      run: mypy sekaibot/

    - name: Run pyright
      run: pyright sekaibot/

    - name: Run pylint
      run: pylint sekaibot/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
